<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高二(3)班 数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #111827; color: #e5e7eb; margin: 0; padding: 32px; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 28px; }
  .cards { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .card { background: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 20px 32px; text-align: center; }
  .card .num { font-size: 30px; font-weight: bold; color: #38bdf8; }
  .card .label { font-size: 13px; color: #9ca3af; margin-top: 6px; }
  .charts { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .chartBox { background: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 20px; width: 480px; max-width: 100%; }
  .chartBox h2 { font-size: 16px; margin: 0 0 12px; color: #93c5fd; }
</style>
</head>
<body>
<h1>📊 高二(3)班 数据看板</h1>

<div class="cards">
  <div class="card"><div class="num" id="stuCount">-</div><div class="label">班级人数</div></div>
  <div class="card"><div class="num" id="avgScore">-</div><div class="label">全班平均分</div></div>
  <div class="card"><div class="num" id="topStudent">-</div><div class="label">最高总分学生</div></div>
</div>

<div class="charts">
  <div class="chartBox">
    <h2>每位学生三次考试总成绩趋势</h2>
    <canvas id="trendChart"></canvas>
  </div>
  <div class="chartBox">
    <h2>每次考试各科平均分对比</h2>
    <canvas id="avgChart"></canvas>
  </div>
</div>

<script>
  // 示例数据（与 data.csv 一致）：姓名, 语文1~3, 数学1~3
  const CSV = `姓名,语文1,语文2,语文3,数学1,数学2,数学3
陈一鸣,78,85,92,92,88,95
李思远,85,82,88,78,90,86
王雨桐,92,94,96,95,97,99
赵天宇,65,72,80,70,75,84
刘欣怡,88,90,91,82,85,89
张浩然,70,68,75,88,92,90`;

  // 核心函数 1：把 CSV 文本解析成结构化数据
  function parseCSV(text) {
    const [header, ...rows] = text.trim().split('\n').map(r => r.split(','));
    return rows.map(row => {
      const obj = {};
      header.forEach((h, i) => obj[h] = i === 0 ? row[i] : Number(row[i]));
      return obj;
    });
  }

  const students = parseCSV(CSV);
  const names = students.map(s => s['姓名']);

  // 核心函数 2：计算统计卡片
  const totals = students.map(s => Object.values(s).slice(1).reduce((a, b) => a + b, 0));
  document.getElementById('stuCount').textContent = students.length;
  document.getElementById('avgScore').textContent =
    (totals.reduce((a, b) => a + b, 0) / totals.length / 6).toFixed(1);
  const topIdx = totals.indexOf(Math.max(...totals));
  document.getElementById('topStudent').textContent = names[topIdx];

  // 图表 1：每位学生三次考试（语文+数学）总分折线图
  const examTotals = students.map(s => [s['语文1'] + s['数学1'], s['语文2'] + s['数学2'], s['语文3'] + s['数学3']]);
  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: ['第1次考试', '第2次考试', '第3次考试'],
      datasets: names.map((n, i) => ({
        label: n, data: examTotals[i], tension: 0.3, borderWidth: 2
      }))
    },
    options: { plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af' } } },
               scales: { x: { ticks: { color: '#9ca3af' } }, y: { ticks: { color: '#9ca3af' } } } }
  });

  // 图表 2：每次考试各科平均分柱状图
  const subjects = ['语文1', '语文2', '语文3', '数学1', '数学2', '数学3'];
  const avgs = subjects.map(sub => students.reduce((a, s) => a + s[sub], 0) / students.length);
  new Chart(document.getElementById('avgChart'), {
    type: 'bar',
    data: {
      labels: subjects,
      datasets: [{ label: '平均分', data: avgs.map(v => v.toFixed(1)),
                   backgroundColor: ['#60a5fa', '#60a5fa', '#60a5fa', '#34d399', '#34d399', '#34d399'] }]
    },
    options: { plugins: { legend: { display: false } },
               scales: { x: { ticks: { color: '#9ca3af' } }, y: { ticks: { color: '#9ca3af' }, min: 0, max: 100 } } }
  });
</script>
</body>
</html>
